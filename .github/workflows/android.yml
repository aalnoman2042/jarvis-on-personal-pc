# Build the Jarvis Android app.
#
# The whole point of building here rather than on Rohan's PC: GitHub's runners
# already have Java and the Android SDK, so the two to four gigabytes of build
# tooling never lands on his machine. He pushes; an APK comes out.
#
# The result is attached to the run as an artifact, and tagged pushes also get a
# Release, so there is a stable link to download from the phone.

name: android apk

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # --- the signing key, kept the same between builds -------------------
      #
      # `assembleDebug` signs with ~/.android/debug.keystore, and on a fresh
      # runner that file does not exist — so Gradle generates a NEW random one
      # every single build. Android refuses to install an APK over an app signed
      # with a different key, so every update failed with "App not installed"
      # and the phone quietly kept running the first APK it ever got. That is
      # how a microphone permission added weeks ago never reached the device:
      # not a permission bug at all, a signing one.
      #
      # Cached under a fixed key so every build signs with the same certificate
      # and installs are real updates. Bump the key's version suffix to start
      # over — which then costs one uninstall, once.
      - name: Restore the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vondo-debug-keystore-v1

      - name: Create it if this is the very first build
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VONDO Debug,O=VONDO,C=BD"
            echo "created a new debug key — this build needs a clean install"
          else
            echo "reusing the cached debug key — this build installs as an update"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -i "SHA1:" || true

      - name: Build the HUD
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy it into the Android project
        working-directory: web
        # `cap sync` also refreshes native plugin wiring, which `cap copy` alone
        # does not — a plugin added since the last build would silently be absent.
        run: npx cap sync android

      - name: Assemble the APK
        working-directory: web/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it something recognisable
        run: |
          mkdir -p out
          cp web/android/app/build/outputs/apk/debug/app-debug.apk \
             "out/jarvis-${GITHUB_SHA::7}.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish a release for tagged builds
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            Install on Android: download the .apk, open it, and allow
            installing from this source when asked.

            Sign in with your PIN. Everything else — memory, the PC link —
            is the same account you already use.
